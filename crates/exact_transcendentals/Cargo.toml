[package]
name = "exact_transcendentals"
version = "1.0.0"
edition = "2021"
authors = ["HackFate Research <research@hackfate.us>"]
description = "Exact integer arithmetic for transcendental functions — zero floating-point, provable error bounds"
license = "LicenseRef-Proprietary-Permissive"
keywords = ["math", "transcendental", "cordic", "exact-arithmetic", "fhe"]
categories = ["mathematics", "algorithms", "no-std"]
readme = "README.md"
repository = "https://hackfate.us"

[features]
default = ["std"]
std = []
# Enable arbitrary precision via CRTBigInt + HCVLangBigInt integration
arbitrary-precision = []

[dependencies]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.bench]
opt-level = 3
lto = true
