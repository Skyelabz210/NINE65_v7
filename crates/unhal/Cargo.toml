[package]
name = "unhal"
description = "Universal Neuromorphic Hardware Abstraction Layer - FHE Accelerator Interface"
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "LicenseRef-Proprietary-AllRightsReserved"

[dependencies]
mana = { path = "../mana" }
rayon = { workspace = true, optional = true }

[features]
# No external parallelism by default — mirrors mana's posture: MANA's
# lane-parallel scheduling is the canonical accelerator for this workspace,
# and rayon is strictly opt-in (benchmarking comparison only).
default = []
parallel = ["rayon", "mana/parallel"]
# The AVX-512 negacyclic NTT kernel (`ntt_simd32`, primes < 2^32) is compiled on
# x86_64 and selected at run time via `available()`; this flag stays empty. The old
# note here ("modular arithmetic doesn't benefit from SIMD") was measured wrong on
# 2026-11-09: see docs/PARALLEL_AND_SIMD_VERDICT_2026-11-09.md.
simd = []
