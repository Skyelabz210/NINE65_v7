[package]
name = "nine65-wasm"
# This crate is excluded from the root workspace and is built through its own
# manifest in CI, so it cannot inherit workspace.package fields.
version = "0.1.0"
edition = "2021"
authors = ["Acidlabz210 <acid@hackfate.us>"]
publish = false
license = "LicenseRef-Proprietary-AllRightsReserved"

[lib]
crate-type = ["cdylib"]
required-features = ["wasm"]

[features]
wasm = ["dep:wasm-bindgen", "nine65/serde"]

[dependencies]
nine65 = { path = "../nine65" }
wasm-bindgen = { version = "0.2", optional = true }
getrandom = { version = "0.2", features = ["js"] }
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
