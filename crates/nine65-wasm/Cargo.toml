[package]
name = "nine65-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]
required-features = ["wasm"]

[features]
wasm = ["dep:wasm-bindgen", "nine65/serde"]

[dependencies]
nine65 = { path = "../nine65" }
wasm-bindgen = { version = "0.2", optional = true }
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
