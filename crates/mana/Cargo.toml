[package]
name = "mana"
description = "Modular Anchored Number Arithmetic - FHE Stream Accelerator"
version.workspace = true
edition.workspace = true
authors.workspace = true

[features]
# MANA defaults to no external parallelism. Its lane-parallel acceleration
# is purpose-built for this system's RNS/integer-only architecture and does
# not use Rayon's general-purpose work-stealing thread pool.
default = []

# Rayon opt-in only. In practice, MANA's own lane scheduling outperforms
# Rayon for this workload. Available for benchmarking comparison only.
parallel = ["rayon"]

# SIMD disabled: counterproductive for modular arithmetic with carry chains.
# simd = ["wide"]

[dependencies]
wide = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
zeroize = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }

# benches/lane_ops.rs uses criterion's own `criterion_main!`, which needs
# `harness = false` so cargo does not also wrap it in the default libtest
# harness. This was commented out, so `cargo bench -p mana` had no declared
# target for it; declaring it here is the fix (see also
# .github/workflows/ci.yml's benchmark-regression job, T4 tier).
[[bench]]
name = "lane_ops"
harness = false
