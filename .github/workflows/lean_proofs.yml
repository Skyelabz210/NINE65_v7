name: Lean Formal Verification

# Lean 4 is the formalization of record. This actually builds every proof module
# (the library globs all KElimination.* submodules), so `lake build` failing —
# or any `sorry` — fails CI. The previous CI only checked that the .lean files
# existed; nothing was ever machine-checked.

on:
  push:
    paths:
      - 'lean4/**'
  pull_request:
    paths:
      - 'lean4/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lean4/KElimination
    steps:
      - uses: actions/checkout@v4

      - name: Install elan (Lean toolchain manager)
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # lean-toolchain pins the version; elan installs it on first use. On GitHub
      # runners the Mathlib olean cache is reachable, so this is fast (no
      # from-source Mathlib build).
      - name: Fetch Mathlib cache
        run: lake exe cache get || true

      # `sorry` only produces a warning (build still exits 0), so fail explicitly
      # if the build log reports any. pipefail makes a real build error fail too.
      - name: Build and verify all proof modules (fail on error or sorry)
        run: |
          set -o pipefail
          lake build 2>&1 | tee build.log
          if grep -q "declaration uses 'sorry'" build.log; then
            echo "::error::Lean build reported 'sorry'"; exit 1
          fi

      # A proof can also be silently swapped for an `axiom` (no `sorry` warning),
      # which keeps the build green while removing machine-checked coverage. This
      # is the authoritative proof gate, so inspect the elaborated *kernel
      # environment* and fail if any KElimination module declares an axiom other
      # than the one documented hardness assumption. Unlike a source grep, this
      # sees through attributes, comments, and macro-synthesized axioms. It runs
      # right after `lake build`, so the module oleans are warm (~10s).
      - name: Assert only the documented axiom (kernel env audit)
        run: bash scripts/axiom_audit.sh
