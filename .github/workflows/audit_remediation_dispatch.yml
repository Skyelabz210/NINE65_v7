name: Trusted audit remediation dispatcher

on:
  pull_request_target:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  remediate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/audit-remediation-20260713'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted same-repository remediation branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: codex/audit-remediation-20260713
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Apply deterministic audit patch
        run: python3 scripts/apply_audit_remediation.py

      - name: Format Rust
        run: cargo fmt --all

      - name: Reject floating point in audited benchmark
        run: |
          if grep -nE '\bf(32|64)\b|as f(32|64)' crates/nine65/src/bin/nine65_bench.rs; then
            echo 'floating-point token found in audited benchmark' >&2
            exit 1
          fi

      - name: Compile all nine65 targets
        run: cargo check -p nine65 --all-targets --features serde

      - name: Run parameter tests
        run: cargo test -p nine65 params:: --lib

      - name: Run audit regressions
        run: cargo test -p nine65 --test audit_regressions

      - name: Commit verified remediation to the PR branch
        run: |
          rm -f scripts/apply_audit_remediation.py .github/workflows/audit_remediation_once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: harden NINE65 parameters and audit reporting'
          git push origin HEAD:codex/audit-remediation-20260713
