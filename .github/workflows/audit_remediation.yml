name: Audit Remediation Gate

# Repaired 2026-08-12 (execution plan Phase 2):
#  * push trigger re-pointed from the deleted branch
#    `hardening/beyond-100-app-platform` to the real trunk `main`. The
#    pull_request half was already live against `main`.
#  * the "SBNI invariant tests" step was removed: `pub mod sbni;` is commented
#    out at crates/nine65/src/ops/mod.rs:16-19, so `ops::sbni` matches zero
#    tests and the step reported success while executing nothing.
#  * the nine65_bench JSON assertions were rewritten against the schema the
#    binary actually emits today. They referenced `depth_chain`,
#    `overall_correct`, `metadata.integer_only_reporting`,
#    `metadata.simulated_refreshes` and `operations.path` — none of which
#    exist any more (the emitter is crates/nine65/src/bin/nine65_bench.rs
#    ~line 465). Every one of those steps was failing on a KeyError, so this
#    gate has been red on `main` PRs for reasons unrelated to the change under
#    test. See the individual step comments for how each assertion was mapped.

on:
  pull_request:
    branches: [main]
    paths:
      - "crates/nine65/src/arithmetic/ntt_fft.rs"
      - "crates/nine65/src/arithmetic/montgomery.rs"
      - "crates/nine65/src/arithmetic/persistent_montgomery.rs"
      - "crates/nine65/src/arithmetic/rns.rs"
      - "crates/nine65/src/bin/nine65_bench.rs"
      - "crates/nine65/src/noise/budget.rs"
      - "crates/nine65/src/ops/auto_bootstrap.rs"
      - "crates/nine65/src/ops/sbni.rs"
      - "crates/nine65/src/params/mod.rs"
      - "crates/nine65/src/params/secure_configs.rs"
      - "scripts/audit_modulus_classes.py"
      - "artifacts/security/modulus_class_audit_2026-07-13.json"
      - "docs/AUDIT_REMEDIATION_2026-07-13.md"
      - ".github/workflows/audit_remediation.yml"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-dual-rns-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Reject floating-point tokens in remediated paths
        shell: bash
        run: |
          set -euo pipefail
          files=(
            crates/nine65/src/arithmetic/ntt_fft.rs
            crates/nine65/src/arithmetic/montgomery.rs
            crates/nine65/src/arithmetic/persistent_montgomery.rs
            crates/nine65/src/bin/nine65_bench.rs
            crates/nine65/src/noise/budget.rs
            crates/nine65/src/ops/auto_bootstrap.rs
            crates/nine65/src/ops/sbni.rs
            crates/nine65/src/params/mod.rs
            crates/nine65/src/params/secure_configs.rs
          )
          if grep -nE '\bf(32|64)\b|as[[:space:]]+f(32|64)' "${files[@]}"; then
            echo "floating-point token found in exact-integer audit paths" >&2
            exit 1
          fi

      # The original two greps looked for
      #   let overall_correct = depth_correct && statistical_correct;
      #   if !overall_correct {
      # Neither string exists in nine65_bench.rs any more — the identifier
      # `overall_correct` is gone from the file entirely, so this step could
      # only ever fail. What survives is the statistical half: a failed
      # statistical run still forces a non-zero exit. That half is asserted
      # here.
      #
      # The depth half genuinely regressed and is NOT asserted: the binary
      # computes `achieved_chain_correct` and reports it in JSON, but never
      # exits non-zero on it. Restoring that is a change to the benchmark
      # binary, not to CI — recorded for the repo owner rather than papered
      # over with a weaker grep that pretends to cover it.
      - name: Verify statistical gate controls exit status
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'eprintln!("Statistical correctness failed: {successes}/100");' \
            crates/nine65/src/bin/nine65_bench.rs
          grep -F 'std::process::exit(1);' crates/nine65/src/bin/nine65_bench.rs
          grep -F 'let achieved_chain_correct = decrypted == plaintext;' \
            crates/nine65/src/bin/nine65_bench.rs

      - name: Verify exact noise accounting is active
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'let delta_bits = exact_delta_bit_length(config);' \
            crates/nine65/src/noise/budget.rs
          ! grep -F '.map(|&p| (64 - p.leading_zeros()) as i64)' \
            crates/nine65/src/noise/budget.rs

      - name: Verify audited secure-128 dimension
        shell: bash
        run: |
          set -euo pipefail
          grep -A8 -F 'pub fn secure_128() -> Self {' \
            crates/nine65/src/params/secure_configs.rs | grep -F '8192'

      - name: Reproduce modulus-class evidence
        run: |
          python3 scripts/audit_modulus_classes.py
          git diff --exit-code -- artifacts/security/modulus_class_audit_2026-07-13.json

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Compile audit benchmark
        run: cargo check -p nine65 --bin nine65_bench --features serde

      - name: Exact parameter and product-boundary tests
        run: cargo test -p nine65 --lib --release params::tests -- --nocapture

      - name: Audited security-profile tests
        run: cargo test -p nine65 --lib --release params::secure_configs::tests -- --nocapture

      - name: Exact noise-budget tests
        run: cargo test -p nine65 --lib --release noise::budget::tests -- --nocapture

      - name: NTT and Montgomery arithmetic tests
        run: |
          cargo test -p nine65 --lib --release ntt_fft -- --nocapture
          cargo test -p nine65 --lib --release montgomery -- --nocapture

      # "SBNI invariant tests" removed here: ops::sbni is no longer in the
      # module tree (crates/nine65/src/ops/mod.rs:16-19), so the filter matched
      # zero tests and the step was a guaranteed pass. The source file is still
      # scanned by the floating-point step above.

      - name: Auto-bootstrap unit tests
        run: cargo test -p nine65 --lib --release ops::auto_bootstrap -- --nocapture

      # Assertion mapping from the old (removed) schema to the current one:
      #   metadata.integer_only_reporting -> every number in the report is an
      #       int, checked structurally below (strictly stronger than the old
      #       self-declared boolean).
      #   metadata.simulated_refreshes    -> scale_tests[*].simulated_refreshes
      #   depth_chain.correct             -> operation_chain.achieved_chain_correct
      #   overall_correct                 -> operation_chain.completed_requested
      #                                      AND achieved_chain_correct
      #   operations.path                 -> DROPPED. The bench no longer emits
      #       a path label; there is no honest substitute, so it is not faked.
      - name: DualRNS leveled smoke test
        run: |
          cargo run --release -p nine65 --bin nine65_bench --features serde -- \
            --config secure_128_deep --max-depth 1 --output /tmp/nine65-leveled.json
          python3 - <<'PY'
          import json
          from pathlib import Path


          def assert_integral(node, path='$'):
              if isinstance(node, bool):
                  return
              if isinstance(node, float):
                  raise AssertionError(f'non-integer number in report at {path}: {node!r}')
              if isinstance(node, dict):
                  for key, value in node.items():
                      assert_integral(value, f'{path}.{key}')
              elif isinstance(node, list):
                  for index, value in enumerate(node):
                      assert_integral(value, f'{path}[{index}]')


          report = json.loads(Path('/tmp/nine65-leveled.json').read_text())
          assert_integral(report)
          assert report['metadata']['bootstrap_mode'] == 'disabled'
          assert report['statistical_test']['enabled'] is False
          for name, scale in report['scale_tests'].items():
              assert scale['simulated_refreshes'] == 0, name
          chain = report['operation_chain']
          assert chain['achieved_chain_correct'] is True
          assert chain['completed_requested'] is True
          assert chain['real_refreshes'] == 0
          PY

      - name: DualRNS automatic-refresh statistical smoke test
        run: |
          cargo run --release -p nine65 --bin nine65_bench --features serde -- \
            --config secure_128_deep --max-depth 1 --auto-bootstrap \
            --statistical-test --output /tmp/nine65-auto.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/nine65-auto.json').read_text())
          assert report['metadata']['bootstrap_mode'] == 'real'
          for name, scale in report['scale_tests'].items():
              assert scale['simulated_refreshes'] == 0, name
          assert report['operation_chain']['achieved_chain_correct'] is True
          statistical = report['statistical_test']
          assert statistical['enabled'] is True
          assert statistical['trials'] == 100
          # old schema: statistical_test.failures == 0
          assert statistical['successes'] == statistical['trials']
          PY
