name: CI

# =============================================================================
# NINE65 v7 — Tiered CI Pipeline
# =============================================================================
# AI Roster and Division of Labor:
#
#   Jules (google-labs-jules[bot])
#     Deep autonomous work: architecture, security hardening, multi-file refactors.
#     Assigned via GitHub Issues. Its commits run the same deterministic gates as
#     every other contributor; authorship must never bypass correctness checks.
#
#   Gemini Flash (free tier, GEMINI_API_KEY secret)
#     PR code review via API. Posts structured analysis as PR comment.
#     Runs in T3. Zero compute cost — one HTTP call, no runner minutes consumed.
#
#   Qwen Coder Cloud (Alibaba DashScope, QWEN_API_KEY secret)
#     Claim registry semantic audit, math-hole detection, proof consistency.
#     Runs in T4 weekly. Already deployed via npm in this repo.
#
#   Qwen Coder Local (Ollama, developer machine only)
#     Pre-commit fast checks. Never appears in CI.
#
#   @claude
#     Invoked via PR comment mention for orchestration, quality assurance,
#     and targeted deep analysis. Not in hot-path automation.
#
#   Codex
#     Advanced math verification, proof-hole detection. On-demand.
#
# =============================================================================
# Tier structure:
#   T1 — Fast gate:  fmt + clippy + deny + static analysis (~3 min, every push)
#   T2 — Full suite: all tests + clockwork (every PR, main pushes, [full-ci])
#   T3 — AI review:  Gemini Flash diff review posted to every PR
#   T4 — Deep:       benchmarks + coverage + Qwen claim audit (Sunday or [deep-ci])
# =============================================================================

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      tier:
        description: 'Force tier: fast | full | deep'
        required: false
        default: 'full'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

jobs:

  # ---------------------------------------------------------------------------
  # T1a — Fast Gate: fmt + clippy + deny
  # Every push/PR, independent of the commit or PR author.
  # ---------------------------------------------------------------------------
  fast-gate:
    name: "T1 · Fast Gate (fmt + clippy + deny)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-fast-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-fast-

      - name: Check formatting
        run: cargo fmt --all -- --check

      # nine65-python / nine65-wasm / nine65-ffi are already excluded at the
      # workspace level (Cargo.toml `[workspace] exclude`), so repeating them as
      # `--exclude` flags here was a no-op that only produced
      # "excluded package(s) ... not found in workspace" warnings.
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check licenses and advisories
        uses: embark-studios/cargo-deny-action@v2

  # ---------------------------------------------------------------------------
  # T1b — Static Analysis and Proofs
  # Every push/PR. Script-based, no Rust compile needed.
  # ---------------------------------------------------------------------------
  static-analysis:
    name: "T1 · Static Analysis & Proofs"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Reject actor-dependent required-job bypasses
        run: python3 scripts/check_required_ci_actor_bypass.py

      - name: Test required-job bypass scanner
        run: python3 -m unittest scripts.test_check_required_ci_actor_bypass

      - name: Validate claim registry
        run: bash scripts/check_claim_registry.sh

      - name: Detect stale claims
        run: bash scripts/check_stale_claims.sh

      # Issue #89: ratchet mode fails on any NEW production panic!/unwrap()/
      # expect() site relative to the committed baseline
      # (scripts/panic_gate_baseline.txt); it does not fail on the existing,
      # tracked backlog (hard cutover to zero is a separate, larger, still-open
      # decision — see the script header). Previously this ran with no
      # argument (advisory: always exits 0), so the scan never actually gated
      # CI despite being present in every run.
      - name: Scan for panic patterns (ratchet)
        run: bash scripts/check_no_panics.sh ratchet

      - name: Scan for float usage in runtime paths
        run: bash scripts/check_no_floats_runtime.sh

      # NOTE: this is a *presence/inventory* gate only. It proves the proof trees
      # have not silently shrunk; it does NOT machine-check anything. The real
      # verification gate is lean_proofs.yml (lake build + axiom audit). The
      # legacy Coq tree is explicitly non-authoritative (see coq_proofs.yml).
      #
      # Previously both steps could not fail by construction: the Coq step was a
      # bare `ls`, and the Lean step only echoed "Missing:" without exiting 1 —
      # and its glob covered lean4/KElimination/*.lean plus one level below,
      # missing the AHOP/ and Lattice/ subdirectories entirely.
      - name: Check Coq proof files present
        run: |
          set -euo pipefail
          if [ ! -d proofs/coq ]; then
            echo "::error::proofs/coq is missing"
            exit 1
          fi
          count=$(find proofs/coq -maxdepth 1 -type f -name '*.v' | wc -l)
          echo "Legacy Coq files in proofs/coq: $count"
          # 16 .v files present as of 2026-08-12. Ratchet: the tree may grow,
          # but a silent deletion must fail this gate.
          if [ "$count" -lt 16 ]; then
            echo "::error::expected at least 16 .v files in proofs/coq, found $count"
            exit 1
          fi

      - name: Check Lean4 proof modules present
        run: |
          set -euo pipefail
          root=lean4/KElimination
          for required in \
            "$root/lakefile.lean" \
            "$root/lean-toolchain" \
            "$root/lake-manifest.json" \
            "$root/KElimination.lean" \
            "$root/scripts/axiom_audit.sh"; do
            if [ ! -f "$required" ]; then
              echo "::error::missing required Lean file: $required"
              exit 1
            fi
          done
          # Recursive: `find` reaches KElimination/AHOP/ and KElimination/Lattice/,
          # which the old two-level glob silently skipped.
          modules=$(find "$root/KElimination" -type f -name '*.lean' | sort)
          count=$(printf '%s\n' "$modules" | grep -c . || true)
          echo "Lean modules under $root/KElimination:"
          printf '%s\n' "$modules"
          echo "count=$count"
          # 20 modules under KElimination/ + KElimination.lean = 21 total as of
          # 2026-08-12. Ratchet: growth is fine, silent deletion is not.
          if [ "$count" -lt 20 ]; then
            echo "::error::expected at least 20 Lean modules under $root/KElimination, found $count"
            exit 1
          fi
          for subdir in AHOP Lattice; do
            if [ ! -d "$root/KElimination/$subdir" ]; then
              echo "::error::missing Lean subdirectory: $root/KElimination/$subdir"
              exit 1
            fi
          done

  # ---------------------------------------------------------------------------
  # T2 — Full Test Suite
  # Runs on: every pull request, pushes to main, [full-ci] in a pushed commit
  # message, or manual dispatch. Depends on fast-gate passing first.
  #
  # The `github.event_name == 'pull_request'` clause closes a real hole. On a
  # pull_request event `github.ref` is `refs/pull/<n>/merge` (never
  # `refs/heads/main`) and `github.event.head_commit` does not exist at all
  # (it is a push-event field), so `contains(github.event.head_commit.message,
  # '[full-ci]')` evaluated against null and was always false. The net effect
  # was that NO pull request — to `develop`, to `main`, or anywhere else — ever
  # ran a single test. Only direct pushes to main did.
  # ---------------------------------------------------------------------------
  full-test:
    name: "T2 · Full Test Suite"
    runs-on: ubuntu-latest
    needs: fast-gate
    if: |
      (
        github.event_name == 'pull_request' ||
        github.ref == 'refs/heads/main' ||
        contains(github.event.head_commit.message, '[full-ci]') ||
        github.event_name == 'workflow_dispatch'
      )
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-full-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-full-

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-full-${{ hashFiles('**/Cargo.lock') }}

      # See the clippy step: the three --exclude flags were no-ops, the packages
      # are excluded from the workspace itself.
      - name: Run all workspace tests
        run: cargo test --workspace --verbose

      - name: Run error variant coverage tests
        run: cargo test -p nine65 --test error_variant_coverage

      - name: Test clockwork feature
        run: cargo test -p nine65 --lib --release --features clockwork

  # ---------------------------------------------------------------------------
  # T3 — Gemini Flash AI Code Review
  # Every PR, independent of actor identity. Secret availability controls only
  # whether Gemini runs; it never controls the mechanical correctness gates.
  # Posts a structured review comment via Gemini 2.0 Flash free tier API.
  # Requires secret: GEMINI_API_KEY
  # If key is absent the step logs a skip message and exits cleanly.
  # ---------------------------------------------------------------------------
  ai-review:
    name: "T3 · Gemini AI Review"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate diff for review
        id: diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD -- \
            '*.rs' '*.toml' '*.yml' '*.md' | head -c 12000 > /tmp/pr_diff.txt
          echo "diff_size=$(wc -c < /tmp/pr_diff.txt)" >> $GITHUB_OUTPUT

      - name: Call Gemini Flash
        id: gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY not configured — skipping AI review"
            echo "review=Gemini review skipped: add GEMINI_API_KEY to repo secrets to enable." >> $GITHUB_OUTPUT
            exit 0
          fi

          DIFF=$(cat /tmp/pr_diff.txt)

          PROMPT="You are reviewing a pull request for NINE65 v7, a proprietary Rust FHE system. Rules: integer-only runtime (zero floats), constant-time security paths, formal Coq/Lean4 proofs, QMNF architecture.

          Review this diff for:
          1. Security — constant-time violations, float in runtime, insecure config leakage
          2. Correctness — RNS/NTT arithmetic, K-Elimination edge cases, bootstrap path integrity
          3. Performance — unnecessary allocations, missed parallelism
          4. Proof alignment — if formal claims touched, do changes stay consistent
          5. Verdict — APPROVE / REQUEST_CHANGES / COMMENT with one-line rationale

          Be concise and technical. Flag real issues only.

          DIFF:
          $DIFF"

          RESPONSE=$(curl -s -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=$GEMINI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{"contents":[{"parts":[{"text":$(echo "$PROMPT" | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))')}]}]}" \
            --max-time 30)

          REVIEW=$(echo "$RESPONSE" | python3 -c "
          import sys, json
          try:
              data = json.load(sys.stdin)
              print(data['candidates'][0]['content']['parts'][0]['text'])
          except Exception as e:
              print('Gemini review unavailable: ' + str(e))
          " 2>/dev/null || echo "Gemini review unavailable")

          echo "review<<REVIEWEOF" >> $GITHUB_OUTPUT
          echo "$REVIEW" >> $GITHUB_OUTPUT
          echo "REVIEWEOF" >> $GITHUB_OUTPUT

      - name: Post Gemini review to PR
        uses: actions/github-script@v7
        with:
          script: |
            const review = `${{ steps.gemini.outputs.review }}`;
            const diffSize = '${{ steps.diff.outputs.diff_size }}';
            const body = [
              '## Gemini Flash · AI Code Review',
              '',
              '_Analyzed ~' + diffSize + ' bytes across .rs/.toml/.yml/.md files_',
              '',
              review,
              '',
              '---',
              '_For deep FHE correctness, math-hole detection, or orchestration: mention @claude in a comment._'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

  # ---------------------------------------------------------------------------
  # T4 — Deep Analysis (Sunday scheduled or [deep-ci] tag or manual dispatch)
  # Benchmarks, coverage, Qwen semantic claim audit.
  # These are the expensive jobs — only run when they provide real signal.
  # ---------------------------------------------------------------------------
  benchmark-regression:
    name: "T4 · Benchmark Regression"
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' ||
      contains(github.event.head_commit.message, '[deep-ci]') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.tier == 'deep')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run benchmark regression check
        run: bash scripts/regression_scan.sh enforced

      # mana's criterion bench (benches/lane_ops.rs) had a commented-out
      # `[[bench]]` stanza in Cargo.toml, so it was never compiled by
      # anything, let alone by CI. `-- --test` is criterion's own smoke mode:
      # it runs each benchmark function exactly once instead of the full
      # statistical sampling, so this is a compile-and-run check, not a
      # perf-regression gate -- there is no committed baseline for mana lane
      # throughput yet. It exists so the bench target itself cannot silently
      # bit-rot.
      - name: Compile and smoke-run mana lane-ops bench
        run: cargo bench -p mana --bench lane_ops -- --test

  timing-tests:
    name: "T4 · Timing Tests"
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' ||
      contains(github.event.head_commit.message, '[deep-ci]') ||
      contains(github.event.head_commit.message, '[timing]') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.tier == 'deep')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # The previous version of this step ended with
      #   python3 scripts/extract_criterion_summary.py timing_output.txt || true
      # which could never do anything: that script takes `--criterion-root` and
      # a *required* `--out`, so a bare positional argument makes argparse exit
      # 2 — and it reads `target/criterion`, which `cargo test` does not
      # produce (Criterion output only exists under `cargo bench`). The
      # `|| true` swallowed the failure, so the step reported success while
      # emitting no summary at all. Removed rather than "fixed" — a Criterion
      # summary belongs in a real `cargo bench` job, which this repo does not
      # have yet (execution plan Phase 8).
      - name: Run timing regression tests
        run: |
          set -o pipefail
          cargo test --package nine65 --lib --release --features clockwork \
            -- clockwork::tests --nocapture 2>&1 | tee timing_output.txt

      - name: Upload timing output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clockwork-timing-output
          path: timing_output.txt
          if-no-files-found: error

  coverage:
    name: "T4 · Code Coverage"
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' ||
      contains(github.event.head_commit.message, '[deep-ci]') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.tier == 'deep')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Generate coverage report
        run: |
          cargo tarpaulin -p nine65 \
            --out Xml --out Html \
            --output-dir coverage/ \
            --timeout 300

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  qwen-claim-audit:
    name: "T4 · Qwen Claim Semantic Audit"
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' ||
      contains(github.event.head_commit.message, '[deep-ci]') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.tier == 'deep')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Qwen Coder semantic claim validation
        env:
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
        run: |
          if [ -z "$QWEN_API_KEY" ]; then
            echo "QWEN_API_KEY not set — skipping Qwen audit (add to repo secrets)"
            exit 0
          fi

          CLAIMS=""
          if [ -f "scripts/claim_registry.json" ]; then
            CLAIMS=$(cat scripts/claim_registry.json | head -c 6000)
          elif [ -f "docs/claim_registry.md" ]; then
            CLAIMS=$(cat docs/claim_registry.md | head -c 6000)
          fi

          SOURCE=$(find crates/nine65/src -name "*.rs" | head -10 | xargs head -n 50 2>/dev/null | head -c 4000)

          PROMPT="Audit the NINE65 v7 FHE claim registry for semantic consistency. Codebase: Rust, K-Elimination, QMNF, RNS, NTT, Montgomery, Coq/Lean4 proofs, zero floats in runtime.

          Identify: stale or inconsistent claims, unproven security claims, unsupported performance claims, missing claims for significant features.

          Be concise. Flag real issues only.

          CLAIMS: $CLAIMS

          SOURCE: $SOURCE"

          RESPONSE=$(curl -s -X POST \
            "https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions" \
            -H "Authorization: Bearer $QWEN_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"model\": \"qwen-coder-plus\",
              \"messages\": [{\"role\": \"user\", \"content\": $(echo "$PROMPT" | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))')}],
              \"max_tokens\": 1500
            }" --max-time 60)

          echo "=== Qwen Coder Claim Audit ==="
          echo "$RESPONSE" | python3 -c "
          import sys, json
          try:
              data = json.load(sys.stdin)
              print(data['choices'][0]['message']['content'])
          except Exception as e:
              print('Parse error: ' + str(e))
          " || echo "Qwen audit response unavailable"
