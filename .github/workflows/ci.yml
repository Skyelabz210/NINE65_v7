name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run timing tests every Sunday at 2 AM UTC
    - cron: '0 2 * * 0'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

jobs:
  test:
    name: Test & Verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.rust }}-

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-test-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --exclude nine65-python --exclude nine65-wasm --exclude nine65-ffi --all-targets -- -D warnings

      - name: Run all tests
        run: cargo test --workspace --exclude nine65-python --exclude nine65-wasm --exclude nine65-ffi --verbose

      - name: Run error variant coverage tests
        run: cargo test -p nine65 --test error_variant_coverage

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Check licenses and advisories
        uses: embark-studios/cargo-deny-action@v2

  static-analysis:
    name: Static Analysis & Proofs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Validate claim registry
        run: bash scripts/check_claim_registry.sh
      - name: Detect stale claims
        run: bash scripts/check_stale_claims.sh
      - name: Scan for panic patterns
        run: bash scripts/check_no_panics.sh
      - name: Scan for float usage
        run: bash scripts/check_no_floats_runtime.sh
      - name: Check Coq proof files
        run: |
          if [ -d "proofs/coq" ]; then
            ls proofs/coq/*.v 2>/dev/null && echo "Coq files found" || echo "No .v files found"
          fi
      - name: Check Lean4 proof files
        run: |
          for proof in lean4/KElimination/*.lean lean4/KElimination/KElimination/*.lean; do
            if [ ! -f "$proof" ]; then
              echo "Missing: $proof"
            fi
          done

  clockwork-feature:
    name: Clockwork Feature
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-clockwork-${{ hashFiles('**/Cargo.lock') }}
      - name: Test clockwork feature
        run: cargo test -p nine65 --lib --release --features clockwork

  benchmark-check:
    name: Benchmark Regression
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run benchmark regression check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bash scripts/regression_scan.sh advisory
          else
            bash scripts/regression_scan.sh enforced
          fi

  timing-tests:
    name: Timing Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || contains(github.event.head_commit.message, '[timing]')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run timing regression tests
        run: |
          cargo test --package nine65 --lib --release --features clockwork \
            -- clockwork::tests --nocapture 2>&1 | tee timing_output.txt
          python3 scripts/extract_criterion_summary.py timing_output.txt || true

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked
      - name: Generate coverage report
        run: cargo tarpaulin -p nine65 --out Xml --out Html --output-dir coverage/ --timeout 300
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
