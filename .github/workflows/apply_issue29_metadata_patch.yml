name: Apply Issue 29 RNS Metadata Patch

on:
  push:
    branches:
      - "audit/remediate-followup-2026-07-13"
    paths:
      - ".github/scripts/apply_issue29_rns_metadata_patch.py"
      - ".github/workflows/apply_issue29_metadata_patch.yml"
      - "crates/nine65/src/ops/rns_fhe.rs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/remediate-followup-2026-07-13
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply deterministic exact-metadata patch
        run: python3 .github/scripts/apply_issue29_rns_metadata_patch.py --apply

      - name: Verify deterministic postcondition
        run: python3 .github/scripts/apply_issue29_rns_metadata_patch.py --check

      - name: Format and compile library
        run: |
          cargo fmt --all
          cargo check -p nine65 --lib
          git diff --check

      - name: Commit verified patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "exact metadata patch already present"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/nine65/src/ops/rns_fhe.rs
          git commit -m "fix(rns): replace product sentinels with exact metadata"
          git push origin HEAD:audit/remediate-followup-2026-07-13
