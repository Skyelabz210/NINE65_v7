name: Constant-Time Verification

# FOUR jobs, deliberately split by what each one can actually prove.
#
#   verify              — deterministic source-level and functional CT gates.
#                         Blocking, every relevant push/PR.
#   dudect-blocking     — the nine two-class timing tests that MEASURE constant
#                         time reliably. Blocking, every relevant push/PR, at
#                         the tight documented threshold (t < 5). See the job
#                         header for why these are safe to block on and the
#                         robust-CV tests are not.
#   open-findings       — the two two-class tests that still measure a REAL
#                         timing leak. Scheduled. These are state tripwires:
#                         the job fails if a documented leak stops reproducing
#                         (which means the docs are now wrong), not because the
#                         leak exists.
#
# 2026-08-22: the two exact_prime_drop tests MOVED from open-findings to
# dudect-blocking. F-1 is closed (CT_VERIFICATION_PLAN.md section 4.8), so they
# now measure constant-time and belong on the blocking side; leaving them in the
# tripwire job would have asserted a leak that no longer exists. The two new
# AdjacencyKElim tests were added to dudect-blocking at the same time. That is
# the transition the tripwire job was built to force, and it worked as designed.
#   diagnostics         — the eight robust-CV tests plus the one borderline
#                         dudect test, run for the record and uploaded.
#                         Scheduled. Gated on producing measurements, not on
#                         their values — with evidence, in the job header.
#
# Measured baselines quoted throughout are from
# docs/CT_VERIFICATION_PLAN.md (2026-08-22, Intel Xeon 2.80GHz, 4 vCPU,
# shared container, load average 1-22 during the runs).

on:
  push:
    branches: [main]
    paths:
      - 'crates/nine65/src/arithmetic/ntt_fft.rs'
      - 'crates/nine65/src/arithmetic/montgomery.rs'
      - 'crates/nine65/src/arithmetic/persistent_montgomery.rs'
      - 'crates/nine65/src/arithmetic/barrett.rs'
      - 'crates/nine65/src/arithmetic/k_elimination.rs'
      - 'crates/nine65/src/ops/rns_fhe.rs'
      - 'crates/nine65/src/security/**'
      - 'scripts/check_ct_ntt_source.py'
      - 'scripts/verify_constant_time.sh'
      - '.github/workflows/ct_verification.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/nine65/src/arithmetic/**'
      - 'crates/nine65/src/ops/rns_fhe.rs'
      - 'crates/nine65/src/security/**'
      - 'scripts/check_ct_ntt_source.py'
      - 'scripts/verify_constant_time.sh'
      - '.github/workflows/ct_verification.yml'
  schedule:
    # Sunday 04:00 UTC — timing diagnostics on an otherwise idle runner.
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: CT source and functional gates
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Source-level CT and public-schedule gate
        run: python3 scripts/check_ct_ntt_source.py | tee ct_ntt_source_report.json

      - name: Existing constant-time source verification
        run: bash scripts/verify_constant_time.sh --verbose | tee verification_script_output.txt

      - name: NTT and persistent-Montgomery correctness
        run: |
          cargo test -p nine65 --lib --release ntt_fft -- --nocapture
          cargo test -p nine65 --lib --release persistent_montgomery -- --nocapture

      # Cheap, deterministic inventory check. It does NOT prove any of the
      # timing tests pass — the dudect-blocking job does that. It proves the
      # harness still contains exactly the tests the docs describe, so a
      # silently deleted timing test cannot slip through.
      - name: Assert the CT timing harness is intact
        run: |
          set -euo pipefail
          listing=$(cargo test -p nine65 --lib --release constant_time_statistical -- \
            --ignored --list 2>/dev/null | grep ': test$' || true)
          echo "$listing"
          count=$(printf '%s\n' "$listing" | grep -c . || true)
          if [ "$count" -ne 18 ]; then
            echo "::error::expected 18 ignored constant_time_statistical tests, found $count"
            echo "::error::(8 robust-CV + 10 dudect two-class; update deliberately if the"
            echo "::error:: harness changed, and update docs/CT_VERIFICATION_PLAN.md with it)"
            exit 1
          fi

      - name: Clippy touched arithmetic modules
        run: cargo clippy -p nine65 --lib -- -D warnings

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ct-verification-report
          if-no-files-found: error
          path: |
            ct_ntt_source_report.json
            verification_script_output.txt

  # ---------------------------------------------------------------------------
  # BLOCKING statistical timing gate.
  #
  # Why these five can block a PR when the older robust-CV tests could not:
  #
  # 1. They are two-class tests. They ask "does the timing depend on the input
  #    class?", which is the constant-time question. The robust-CV tests ask
  #    "how dispersed is one distribution?", which on a shared runner is a
  #    question about the neighbours.
  #
  # 2. Class order is randomised per measurement, so machine drift is shared by
  #    both classes instead of being attributed to one.
  #
  # 3. Every run carries a CONTROL arm: two independent sample streams from the
  #    SAME class. The test can only FAIL when the control t stays below 5 while
  #    the cross-class t does not. On a runner too noisy to measure, the control
  #    goes above 5 first and the verdict becomes INCONCLUSIVE, which passes.
  #    A noisy runner therefore costs signal, never a false red. That property
  #    is what makes a timing test safe to block on, and it is why no threshold
  #    dilution is needed here: the threshold is the tight documented t < 5.
  #
  # Measured stability of exactly these five on a 4-vCPU shared container,
  # deliberately including runs at load average 20-22 (see the plan doc):
  #    montgomery_pow  (exponent Hamming weight 8 vs 56) : t = 0.01 - 2.05
  #    montgomery_mul  (operand magnitude)               : t = 0.04 - 2.78
  #    montgomery_reduce (operand magnitude)             : t = 0.27 - 2.29
  #    barrett reduce_ct (operand magnitude)             : t = 0.01 - 1.59
  #    mod_switch_down_dual (sign, magnitude-matched)    : t = 0.08 - 2.29
  # Worst observed 2.78 against a threshold of 5.
  # ---------------------------------------------------------------------------
  dudect-blocking:
    name: CT dudect gate (blocking, t < 5)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build test binary
        run: cargo test -p nine65 --lib --release --no-run

      # Run one at a time so a failure names the exact operation, and so the
      # measured statistics for every test reach the log even when an earlier
      # one fails.
      - name: Run blocking dudect tests
        run: |
          set -euo pipefail
          prefix=security::ct_verification::constant_time_statistical
          for t in \
            test_ct_dudect_montgomery_pow_exponent_hamming_weight \
            test_ct_dudect_montgomery_reduce_operand_magnitude \
            test_ct_dudect_montgomery_mul_operand_magnitude \
            test_ct_dudect_barrett_reduce_operand_magnitude \
            test_ct_dudect_mod_switch_rescale_sign_classes \
            test_ct_dudect_exact_prime_drop_fixed_vs_random \
            test_ct_dudect_exact_prime_drop_small_vs_large_residues \
            test_ct_dudect_adjacency_k_elim_operand_magnitude \
            test_ct_dudect_adjacency_k_elim_operand_order
          do
            echo "::group::$t"
            cargo test -p nine65 --lib --release -- \
              --ignored --exact --nocapture --test-threads 1 "$prefix::$t" \
              2>&1 | tee -a dudect_blocking_output.txt
            echo "::endgroup::"
          done

      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ct-dudect-blocking
          if-no-files-found: error
          path: dudect_blocking_output.txt

  # ---------------------------------------------------------------------------
  # OPEN FINDINGS — known-red tripwires, scheduled.
  #
  # These two tests measure timing leaks that are real, reproducible and
  # currently unfixed. (There were four. The two exact_prime_drop tests moved to
  # dudect-blocking on 2026-08-22 when F-1 was closed.) They are recorded in docs/CT_VERIFICATION_PLAN.md with
  # their measured statistics. Running them as an ordinary blocking gate would
  # paint CI permanently red for a state that is already documented, and the
  # red would stop meaning anything within a week.
  #
  # So the gate is inverted, and it is a gate, not a shrug: this job asserts
  # that each test still reports "VERDICT: TIMING DEPENDENCE MEASURED". It
  # fails if a test instead reports CONSTANT-TIME — because that means someone
  # fixed the leak (or broke the test) and the documentation is now wrong. It
  # also fails if a test emits no verdict at all, which is what a crash or a
  # build break looks like. An INCONCLUSIVE verdict (the runner's own noise
  # floor exceeded the threshold) is accepted as "no news" and reported.
  #
  # There is no continue-on-error and no `|| true` anywhere in this job. Every
  # cargo invocation's exit status is inspected explicitly, and a failure to
  # produce measurements is a failure of the job.
  # ---------------------------------------------------------------------------
  open-findings:
    name: CT open findings (scheduled state tripwire)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build test binary
        run: cargo test -p nine65 --lib --release --no-run

      - name: Assert documented timing leaks still reproduce
        run: |
          set -uo pipefail
          prefix=security::ct_verification::constant_time_statistical
          status=0
          : > open_findings_output.txt
          for t in \
            test_ct_dudect_mod_switch_rescale_fixed_vs_random \
            test_ct_dudect_k_elim_extract_k_operand_magnitude
          do
            echo "::group::$t"
            out=$(cargo test -p nine65 --lib --release -- \
                    --ignored --exact --nocapture --test-threads 1 "$prefix::$t" 2>&1)
            echo "$out"
            printf '%s\n' "$out" >> open_findings_output.txt
            echo "::endgroup::"

            if printf '%s' "$out" | grep -q 'VERDICT: TIMING DEPENDENCE MEASURED'; then
              echo "$t: leak still reproduces (expected)"
            elif printf '%s' "$out" | grep -q 'VERDICT: INCONCLUSIVE'; then
              echo "::warning::$t: runner noise floor exceeded the threshold; no news this week"
            elif printf '%s' "$out" | grep -q 'VERDICT: CONSTANT-TIME'; then
              echo "::error::$t now measures CONSTANT-TIME."
              echo "::error::A documented open finding has stopped reproducing. Either the leak"
              echo "::error::was fixed (update docs/CT_VERIFICATION_PLAN.md and promote this"
              echo "::error::test into the dudect-blocking job) or the test stopped measuring"
              echo "::error::what it claims to. Both need a human."
              status=1
            else
              echo "::error::$t produced no dudect verdict — the harness did not run."
              status=1
            fi
          done
          exit "$status"

      # -----------------------------------------------------------------
      # UNSTABLE-VERDICT FINDINGS — collected, reported, NOT verdict-gated,
      # and labelled as such rather than smuggled past a threshold.
      #
      # test_ct_dudect_k_elim_exact_divide_divisor_classes measures a REAL
      # divisor-dependent timing dependence in KElimination::exact_divide
      # (divisor 3 consistently slower than divisor 2; |t| grows with round
      # count: mean ~3 at 2000 rounds, ~6.6 at 8000, 11.4 at the one clean
      # 32000-round run, controls 0.46-1.27). But its VERDICT is not stable at
      # any round count the reference machine can sustain: 2 of 3 runs report
      # DEPENDENCE at 8000, and at 32000 the control arm itself exceeds the
      # threshold so the harness reports INCONCLUSIVE.
      #
      # So it can gate on neither direction: not in dudect-blocking (it would
      # be a coin-flip red), not in the inverted tripwire above (that needs a
      # stable DEPENDENCE verdict). What CAN be asserted, and is asserted
      # below, is that the harness ran and produced a verdict at all. The
      # verdict itself is surfaced as a warning and archived.
      #
      # This is a smaller gate than the others in this file, stated plainly so
      # nobody reads the job name and assumes more. Settling it needs a
      # quiesced, frequency-pinned runner.
      # -----------------------------------------------------------------
      - name: Collect unstable-verdict findings (harness-gated, not verdict-gated)
        run: |
          set -uo pipefail
          prefix=security::ct_verification::constant_time_statistical
          t=test_ct_dudect_k_elim_exact_divide_divisor_classes
          echo "::group::$t"
          out=$(cargo test -p nine65 --lib --release -- \
                  --ignored --exact --nocapture --test-threads 1 "$prefix::$t" 2>&1)
          echo "$out"
          { echo "### $t (unstable verdict, not gated)"; printf '%s\n' "$out"; } \
            >> open_findings_output.txt
          echo "::endgroup::"

          if printf '%s' "$out" | grep -q 'VERDICT:'; then
            verdict=$(printf '%s' "$out" | grep -m1 'VERDICT:')
            echo "::warning::$t (verdict not stable, reported only): $verdict"
            exit 0
          fi
          echo "::error::$t produced no dudect verdict — the harness did not run."
          exit 1

      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ct-open-findings
          if-no-files-found: error
          path: open_findings_output.txt

  # ---------------------------------------------------------------------------
  # DIAGNOSTICS — the robust-CV suite, scheduled, recorded, AND threshold-gated.
  #
  # This job collects measurements and fails both when it fails to collect them
  # and when a collected measurement fails its assertion.
  #
  # HISTORY (this is a repair, and the earlier state is worth stating plainly).
  # This job used to downgrade a nonzero cargo exit to `::warning::`, which is
  # continue-on-error written as an if-branch: with the family-(a) CV threshold
  # asserted nowhere else in CI, no job anywhere enforced
  # ROBUST_CV_THRESHOLD = 0.05. The reason given was real instability — on this
  # project's own hardware, unchanged code produced
  #   montgomery_reduce: CV = 0.0000% (MAD 0, median 29ns) on one run,
  #                      CV = 5.2950% (MAD 1, median 28ns) on the next
  # — a pass and a fail one clock tick apart.
  #
  # That instability has since been fixed AT THE ASSERTION rather than routed
  # around here. `TimingStats::cv_failure` no longer applies the 5% CV band
  # below `CV_RESOLVABLE_MEDIAN_NS` (~59.3ns), where a 1ns-quantised MAD cannot
  # land inside it; it applies the bound quantisation can actually explain,
  # MAD <= 1 tick. Both arms of the flip above are MAD <= 1, so both now pass
  # deterministically, and the same change removed three tests
  # (montgomery_reduce, montgomery_mul, barrett_reduce) from the state where
  # they reported `ok` while asserting nothing at all.
  #
  # Re-measured after that change, two full runs of all eight family-(a) tests:
  # 16/16 exit 0, including a run that reproduced the 5.2950% value verbatim.
  # So the numbers are now gateable, and gating them is the honest thing to do.
  # The dudect-blocking job remains the sharper evidence for these operations;
  # this job is the one that holds the CV threshold to account.
  #
  # test_ct_dudect_k_elim_exact_divide_divisor_classes is NOT in this list. It
  # was, back when this job downgraded failures to warnings; now that the job
  # gates on the exit status it cannot stay, because its verdict is not stable
  # (see the unstable-verdict step in the open-findings job below, and
  # DUDECT_DIVISOR_CLASS_ROUNDS in ct_verification.rs for the measurements).
  # Leaving it here would have re-created the coin-flip red this repair exists
  # to remove.
  # ---------------------------------------------------------------------------
  diagnostics:
    name: CT robust-CV diagnostics (scheduled, recorded)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build test binary
        run: cargo test -p nine65 --lib --release --no-run

      - name: Collect robust-CV and borderline measurements
        run: |
          set -uo pipefail
          prefix=security::ct_verification::constant_time_statistical
          : > diagnostics_output.txt
          status=0
          for t in \
            test_ct_k_elimination_extract_k \
            test_ct_k_elimination_exact_divide \
            test_ct_montgomery_reduce \
            test_ct_montgomery_mul \
            test_ct_montgomery_pow \
            test_ct_barrett_reduce \
            test_ct_vs_vartime_comparison \
            test_ct_input_class_analysis \
            test_ct_adjacency_vs_general_k_elim_cost
          do
            echo "::group::$t"
            out=$(cargo test -p nine65 --lib --release -- \
                    --ignored --exact --nocapture --test-threads 1 "$prefix::$t" 2>&1)
            rc=$?
            echo "$out"
            { echo "### $t (cargo exit $rc)"; printf '%s\n' "$out"; } >> diagnostics_output.txt
            echo "::endgroup::"

            # Gate 1: did the harness actually produce numbers? A test that
            # emitted no median and no dudect verdict did not run.
            if ! printf '%s' "$out" | grep -qE 'median=|median class|VERDICT:'; then
              echo "::error::$t produced no measurements (cargo exit $rc)"
              status=1
            fi

            # Gate 2: did every collected measurement pass its assertion?
            # A nonzero cargo exit here is a real failure, not a warning. It is
            # NOT downgraded — see the job header for why it used to be and why
            # that is no longer justified.
            if [ "$rc" -ne 0 ]; then
              echo "::error::$t failed its assertion on this runner (cargo exit $rc); see the artifact"
              status=1
            fi
          done
          exit "$status"

      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ct-diagnostics
          if-no-files-found: error
          path: diagnostics_output.txt
