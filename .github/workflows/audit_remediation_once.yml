name: Apply audit remediation once

on:
  push:
    branches:
      - codex/audit-remediation-20260713

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: codex/audit-remediation-20260713
          fetch-depth: 0

      - name: Apply deterministic source patch
        run: python3 scripts/apply_audit_remediation.py

      - name: Format Rust
        run: cargo fmt --all

      - name: Reject floating point in audited benchmark
        run: |
          if grep -nE '\bf(32|64)\b|as f(32|64)' crates/nine65/src/bin/nine65_bench.rs; then
            echo 'floating-point token found in audited benchmark' >&2
            exit 1
          fi

      - name: Compile all nine65 targets
        run: cargo check -p nine65 --all-targets --features serde

      - name: Run parameter tests
        run: cargo test -p nine65 params:: --lib

      - name: Run audit regressions
        run: cargo test -p nine65 --test audit_regressions

      - name: Commit remediated tree and remove one-shot automation
        run: |
          rm -f scripts/apply_audit_remediation.py .github/workflows/audit_remediation_once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: harden NINE65 parameters and audit reporting'
          git push origin HEAD:codex/audit-remediation-20260713
