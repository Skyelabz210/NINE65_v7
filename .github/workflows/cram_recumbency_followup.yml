name: CRAM Recumbency Follow-up Gate

# Branch gating repaired: the pull_request trigger named
# `hardening/beyond-100-app-platform`, a branch that no longer exists (the
# repo has only `main` and `claude/*`), so this workflow's PR trigger never
# fired on real PR activity -- only `workflow_dispatch` reached it. Re-pointed
# at the real trunk, matching the fix already applied to
# app_platform_gates.yml and the other cram_*.yml workflows on 2026-08-12.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "crates/nine65/src/arithmetic/k_elimination.rs"
      - "crates/nine65/src/arithmetic/residue_division.rs"
      - "crates/nine65/src/arithmetic/mod.rs"
      - "crates/nine65/src/arithmetic/rns.rs"
      - "crates/nine65/src/bin/nine65_bench.rs"
      - "crates/nine65/src/noise/budget.rs"
      - "crates/nine65/src/ops/auto_bootstrap.rs"
      - "crates/nine65/src/ops/bootstrap.rs"
      - "crates/nine65/src/ops/rns_fhe.rs"
      - "crates/nine65/src/params/mod.rs"
      - "crates/nine65/src/params/secure_configs.rs"
      - "crates/nine65/tests/bootstrap_residue_shape_regression.rs"
      - "crates/nine65/tests/dual_rns_context_metadata_regression.rs"
      - "crates/nine65/tests/k_elimination_basis_regression.rs"
      - "crates/nine65/tests/refresh_preflight_regression.rs"
      - "crates/nine65/tests/rns_context_metadata_regression.rs"
      - ".github/scripts/apply_issue29_rns_metadata_patch.py"
      - ".github/scripts/check_cram_recumbency.py"
      - "docs/CRAM_RESIDUE_NATIVE_BOOTSTRAP_SPEC.md"
      - "docs/AUDIT_REMEDIATION_2026-07-13.md"
      - ".github/workflows/cram_recumbency_followup.yml"
  workflow_dispatch:
permissions:
  contents: read

jobs:
  exact-cram-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt

      - name: Enforce CRAM recumbency contract
        run: python3 .github/scripts/check_cram_recumbency.py

      - name: Verify exact RNS context metadata patch
        run: python3 .github/scripts/apply_issue29_rns_metadata_patch.py --check

      - name: Reject floating-point tokens in exact paths
        shell: bash
        run: |
          set -euo pipefail
          files=(
            crates/nine65/src/arithmetic/residue_division.rs
            crates/nine65/src/bin/nine65_bench.rs
            crates/nine65/src/noise/budget.rs
            crates/nine65/src/ops/auto_bootstrap.rs
            crates/nine65/src/params/mod.rs
            crates/nine65/src/params/secure_configs.rs
            crates/nine65/tests/bootstrap_residue_shape_regression.rs
            crates/nine65/tests/dual_rns_context_metadata_regression.rs
            crates/nine65/tests/k_elimination_basis_regression.rs
            crates/nine65/tests/refresh_preflight_regression.rs
            crates/nine65/tests/rns_context_metadata_regression.rs
          )
          if grep -nE '\bf(32|64)\b|as[[:space:]]+f(32|64)|[0-9]+\.[0-9]+' "${files[@]}"; then
            echo "floating-point token found in exact-integer paths" >&2
            exit 1
          fi

      - name: Verify current benchmark correctness contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'eprintln!("Statistical correctness failed: {successes}/100");' \
            crates/nine65/src/bin/nine65_bench.rs
          grep -F 'std::process::exit(1);' crates/nine65/src/bin/nine65_bench.rs
          grep -F 'let achieved_chain_correct = decrypted == plaintext;' \
            crates/nine65/src/bin/nine65_bench.rs
          grep -F '"achieved_chain_correct": achieved_chain_correct,' \
            crates/nine65/src/bin/nine65_bench.rs

      - name: Verify exact noise accounting
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          sys.path.insert(0, ".github/scripts")
          from check_cram_recumbency import production_view

          source = production_view("crates/nine65/src/noise/budget.rs")
          required = "fn exact_delta_bit_length(config: &FHEConfig) -> i64"
          legacy = ".map(|&p| (64 - p.leading_zeros()) as i64)"

          if required not in source:
              raise SystemExit("exact multi-limb delta bit-length helper is missing from executable code")
          if legacy in source:
              raise SystemExit("legacy summed-prime-bit-width calculation remains in executable code")
          print("Noise budget source contract passed (comments and strings excluded).")
          PY

      - name: Verify audited secure-128 dimension
        shell: bash
        run: |
          set -euo pipefail
          grep -A8 -F 'pub fn secure_128() -> Self {' \
            crates/nine65/src/params/secure_configs.rs | grep -F '8192'

      - name: Verify committed modulus-class evidence
        run: |
          python3 scripts/audit_modulus_classes.py
          git diff --exit-code -- artifacts/security/modulus_class_audit_2026-07-13.json

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Compile audit benchmark
        run: cargo check -p nine65 --bin nine65_bench --features serde

      - name: Exact parameter and product-boundary tests
        run: cargo test -p nine65 --lib --release params::tests -- --nocapture

      - name: Audited security-profile tests
        run: cargo test -p nine65 --lib --release params::secure_configs::tests -- --nocapture

      - name: Exact noise-budget tests
        run: cargo test -p nine65 --lib --release noise::budget::tests -- --nocapture

      - name: Bounded residue-division contract tests
        run: cargo test -p nine65 --lib --release arithmetic::residue_division::tests -- --nocapture

      - name: Exact refresh-preflight regression
        run: cargo test -p nine65 --release --test refresh_preflight_regression -- --nocapture

      - name: Exact RNS context metadata regression
        run: cargo test -p nine65 --release --test rns_context_metadata_regression -- --nocapture

      - name: Exact DualRNS family metadata regression
        run: cargo test -p nine65 --release --test dual_rns_context_metadata_regression -- --nocapture

      - name: K-Elimination safe-basis regression
        run: cargo test -p nine65 --release --test k_elimination_basis_regression -- --nocapture

      - name: K-Elimination residue/boundary tests
        run: cargo test -p nine65 --lib --release arithmetic::k_elimination::tests -- --nocapture

      - name: NTT roundtrip regression
        run: cargo test -p nine65 --release --test ntt_roundtrip_prime_regression -- --nocapture

      # SBNI is not exported by the current ops module, so an ops::sbni
      # test filter matched zero tests and gave a false-green signal. Its
      # source was removed from the active test surface; do not claim coverage.
      - name: Auto-bootstrap unit tests
        run: cargo test -p nine65 --lib --release ops::auto_bootstrap -- --nocapture

      - name: Clockwork bootstrap unit tests
        run: cargo test -p nine65 --lib --release ops::bootstrap -- --nocapture

      - name: Bootstrap residue-shape regression
        run: cargo test -p nine65 --release --test bootstrap_residue_shape_regression -- --nocapture

      - name: DualRNS leveled smoke test
        # Deterministic correctness evidence runs in debug; release builds
        # intentionally reject the benchmark's test RNG.
        run: |
          set -euo pipefail
          cargo run --locked -p nine65 --bin nine65_bench --features serde -- \
            --config secure_128_deep --max-depth 1 --output /tmp/nine65-leveled.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/nine65-leveled.json').read_text())

          def assert_integral(node, path='$'):
              if isinstance(node, bool):
                  return
              if isinstance(node, float):
                  raise AssertionError(f'non-integer number in report at {path}: {node!r}')
              if isinstance(node, dict):
                  for key, value in node.items():
                      assert_integral(value, f'{path}.{key}')
              elif isinstance(node, list):
                  for index, value in enumerate(node):
                      assert_integral(value, f'{path}[{index}]')

          assert_integral(report)
          assert report['metadata']['bootstrap_mode'] == 'disabled'
          assert report['statistical_test']['enabled'] is False
          for name, scale in report['scale_tests'].items():
              assert scale['simulated_refreshes'] == 0, name
          chain = report['operation_chain']
          assert chain['achieved_chain_correct'] is True
          assert chain['completed_requested'] is True
          assert chain['real_refreshes'] == 0
          PY

      # Issue #95: public refresh remains fail-closed until Phase 1 carries the
      # secret-dependent displaced quotient/carry exactly.
      - name: Public refresh boundary and typed refusal
        run: cargo test -p nine65 --lib --release auto_refresh_boundary_is_exact_then_typed_refusal -- --nocapture
