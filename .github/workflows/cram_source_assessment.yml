name: CRAM source attack assessment

# Bounded research assessments. The authors' full native search is manual;
# the wider CI cost pause and production correctness/security gates are unchanged.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/cram_sparse_source_screen.py
      - scripts/cram_gb_series.py
      - scripts/cram_hou_jiang_screen.py
      - scripts/security/hou_jiang_source_lock.json
      - .github/workflows/cram_source_assessment.yml

permissions:
  contents: read

concurrency:
  group: cram-source-assessment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hou-jiang-authors-implementation:
    # Native full search is explicitly dispatched; fast driver checks remain
    # in the normal refresh research workflow.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Fetch pinned authors' estimator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: identitymapping/enhanced_hybrid_attack
          ref: d60cac04dea5a397b8489cce7171f3fe38b277d8
          path: research-hou-jiang
          persist-credentials: false
      - name: Verify revision and prepare evidence
        env:
          ASSESSMENT_DIR: ${{ runner.temp }}/cram-hou-jiang-results
        run: |
          test "$(git -C research-hou-jiang rev-parse HEAD)" = d60cac04dea5a397b8489cce7171f3fe38b277d8
          mkdir -p "$ASSESSMENT_DIR"
          chmod 777 "$ASSESSMENT_DIR"
      - name: Compare baseline and enhanced authors' searches on the exact source
        env:
          ASSESSMENT_DIR: ${{ runner.temp }}/cram-hou-jiang-results
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 128 --memory 6g --cpus 2 \
            --tmpfs /tmp:rw,size=1g \
            --tmpfs /home/sage/.sage:rw,uid=1000,gid=1000,size=128m \
            -e OPENBLAS_NUM_THREADS=1 -e OMP_NUM_THREADS=1 \
            -v "$PWD:/repo:ro" -v "$ASSESSMENT_DIR:/results:rw" \
            sagemath/sagemath@sha256:19995db6194f4a4bab18ce9a88556fd15b9ed5e916b4504fefe618a7796ddbdb \
            sage -python /repo/scripts/cram_hou_jiang_screen.py \
              --source /repo/research-hou-jiang --output /results/assessment.json \
              --timeout 1800 --jobs 2
      - name: Retain complete or partial authors' implementation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cram-hou-jiang-authors-implementation
          path: ${{ runner.temp }}/cram-hou-jiang-results/*.json
          if-no-files-found: warn
          retention-days: 14
  attack-costs:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        profile: [balanced96_low_q]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Fetch pinned upstream estimator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: malb/lattice-estimator
          ref: f31b86fe490ab11abb4a69efa13007583791e10a
          path: research-upstream
          persist-credentials: false
      - name: Fetch pinned rotated sparse estimator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: jdumezy/sparse-key-estimate
          ref: aa2c40d4eee4551e6fba06c55d7432f6918e1597
          path: research-rotated
          submodules: recursive
          persist-credentials: false
      - name: Verify pinned source and prepare evidence directory
        env:
          ASSESSMENT_DIR: ${{ runner.temp }}/cram-source-results
        run: |
          test "$(git -C research-upstream rev-parse HEAD)" = f31b86fe490ab11abb4a69efa13007583791e10a
          test "$(git -C research-rotated rev-parse HEAD)" = aa2c40d4eee4551e6fba06c55d7432f6918e1597
          test "$(git -C research-rotated/PrimalHybrid/lattice_estimator rev-parse HEAD)" = 6019056011d10d7e9c30a0d5da2d2f729fbc2eec
          mkdir -p "$ASSESSMENT_DIR"
          chmod 777 "$ASSESSMENT_DIR"
      - name: Assess concrete source profiles with Sage
        env:
          PROFILE: ${{ matrix.profile }}
          ASSESSMENT_DIR: ${{ runner.temp }}/cram-source-results
        run: |
          docker run --rm --network none \
            -v "$PWD:/repo:ro" \
            -v "$ASSESSMENT_DIR:/results" \
            sagemath/sagemath@sha256:19995db6194f4a4bab18ce9a88556fd15b9ed5e916b4504fefe618a7796ddbdb \
            sage -python /repo/scripts/cram_sparse_source_screen.py \
              --profile "$PROFILE" \
              --upstream /repo/research-upstream \
              --rotated /repo/research-rotated \
              --output "/results/$PROFILE.json" --jobs 2 --attack-timeout 300 \
              --resume /repo/artifacts/execution/2026-10-23/source-encapsulation/security/resumed-balanced96_low_q.json \
              --resume-sha256 42eb064ee096190e79875f8d9147805f53cd45271bb43a47906c34d6d304719c
      - name: Retain complete or partial attack evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cram-source-${{ matrix.profile }}
          path: ${{ runner.temp }}/cram-source-results/*.json
          if-no-files-found: warn
          retention-days: 14
