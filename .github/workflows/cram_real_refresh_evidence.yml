name: CRAM Real Refresh Evidence

# Branch gating repaired: the pull_request trigger named
# `hardening/beyond-100-app-platform`, a branch that no longer exists (the
# repo has only `main` and `claude/*`), so this workflow's PR trigger never
# fired on real PR activity -- only `workflow_dispatch` reached it. Re-pointed
# at the real trunk, matching the fix already applied to
# app_platform_gates.yml and the other cram_*.yml workflows on 2026-08-12.

on:
  push:
    branches:
      - main
    paths:
      - "crates/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/cram_real_refresh_evidence.yml"
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "crates/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/cram_real_refresh_evidence.yml"
  workflow_dispatch:
permissions:
  contents: read

jobs:
  public-refresh-research:
    name: "Research only · public refresh/return/repeat + production refusal"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: dtolnay/rust-toolchain@1.89.0

      - name: Verify exact-test runner and public integer bounds
        env:
          PYTHONPATH: scripts
        run: >-
          python3 -m unittest -v
          test_run_public_refresh_research_gates
          test_public_refresh_architecture
          test_compact_phase_clock_budget
          test_outer_ring_return_budget
          test_source_encapsulation_budget

      - name: Require production public refresh to remain typed fail-closed
        run: >-
          python3 scripts/run_public_refresh_research_gates.py
          --suite production-boundary
          --log-dir work/public-refresh-gates/production-boundary

      # Explicitly opt in only to small-ring complete research probes. Their
      # public evaluators receive no decryption oracle; a client checks every
      # output coefficient, return to the work key and two dependent cycles.
      # These tests do not admit native refresh or replace the blocker below.
      - name: Check small-ring public refresh and plaintext-scale boundaries
        run: >-
          python3 scripts/run_public_refresh_research_gates.py
          --suite research
          --log-dir work/public-refresh-gates/research

      # The full-Q square checks all 16384 coefficients against an independent
      # schoolbook oracle; the nonlinear section still runs at its Q211 level.
      # Neither result is a native refresh/return/repeat acceptance claim.
      - name: Check native wide arithmetic and Frobenius section only
        run: >-
          python3 scripts/run_public_refresh_research_gates.py
          --suite native-arithmetic
          --log-dir work/public-refresh-gates/native-arithmetic

      - name: Preserve focused evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-refresh-research-${{ github.sha }}
          path: work/public-refresh-gates/
          if-no-files-found: warn

  # Keep the original real automatic-refresh acceptance gate. Passing the
  # separate research/refusal regressions above cannot turn it green.
  forced-real-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: dtolnay/rust-toolchain@1.89.0

      - name: Compile exact benchmark
        run: cargo check -p nine65 --bin nine65_bench --features serde

      - name: Exact refresh-preflight regression
        run: cargo test -p nine65 --release --test refresh_preflight_regression -- --nocapture

      - name: Force and prove real automatic refresh
        # This is a deterministic correctness/evidence run, not a performance
        # benchmark. The RNG guard intentionally allows seeded RNG in debug
        # builds and forbids it in release builds.
        run: |
          set -euo pipefail
          cargo run --locked -p nine65 --bin nine65_bench --features serde -- \
            --config secure_128_deep --max-depth 1 --auto-bootstrap \
            --trigger-pct 100 --statistical-test \
            --output /tmp/nine65-forced-refresh.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/nine65-forced-refresh.json').read_text())

          def assert_integral(node, path='$'):
              if isinstance(node, bool):
                  return
              if isinstance(node, float):
                  raise AssertionError(f'non-integer number in report at {path}: {node!r}')
              if isinstance(node, dict):
                  for key, value in node.items():
                      assert_integral(value, f'{path}.{key}')
              elif isinstance(node, list):
                  for index, value in enumerate(node):
                      assert_integral(value, f'{path}[{index}]')

          assert_integral(report)
          assert report['metadata']['bootstrap_mode'] == 'real'
          chain = report['operation_chain']
          assert chain['requested_operations'] == 1
          assert chain['completed_requested'] is True
          assert chain['achieved_chain_correct'] is True
          assert chain['real_refreshes'] > 0
          statistical = report['statistical_test']
          assert statistical['enabled'] is True
          assert statistical['trials'] == 100
          assert statistical['successes'] == statistical['trials']
          assert statistical['real_refreshes'] > 0
          PY
