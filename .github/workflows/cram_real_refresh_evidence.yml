name: CRAM Real Refresh Evidence

# Branch gating repaired: the pull_request trigger named
# `hardening/beyond-100-app-platform`, a branch that no longer exists (the
# repo has only `main` and `claude/*`), so this workflow's PR trigger never
# fired on real PR activity -- only `workflow_dispatch` reached it. Re-pointed
# at the real trunk, matching the fix already applied to
# app_platform_gates.yml and the other cram_*.yml workflows on 2026-08-12.

on:
  push:
    branches:
      - main
    paths:
      - "crates/nine65/src/bin/nine65_bench.rs"
      - "crates/nine65/src/noise/budget.rs"
      - "crates/nine65/src/ops/auto_bootstrap.rs"
      - "crates/nine65/src/ops/bootstrap.rs"
      - "crates/nine65/src/ops/rns_fhe.rs"
      - "crates/nine65/src/ops/public_phase_clock.rs"
      - "crates/nine65/src/arithmetic/phase_clock_plan.rs"
      - "crates/nine65/src/arithmetic/canonical_scale_round.rs"
      - "crates/nine65/tests/refresh_preflight_regression.rs"
      - "scripts/check_real_refresh_evidence.py"
      - "scripts/test_real_refresh_evidence.py"
      - ".github/workflows/cram_real_refresh_evidence.yml"
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "crates/nine65/src/bin/nine65_bench.rs"
      - "crates/nine65/src/noise/budget.rs"
      - "crates/nine65/src/ops/auto_bootstrap.rs"
      - "crates/nine65/src/ops/bootstrap.rs"
      - "crates/nine65/src/ops/rns_fhe.rs"
      - "crates/nine65/src/ops/public_phase_clock.rs"
      - "crates/nine65/src/arithmetic/phase_clock_plan.rs"
      - "crates/nine65/src/arithmetic/canonical_scale_round.rs"
      - "crates/nine65/tests/refresh_preflight_regression.rs"
      - "scripts/check_real_refresh_evidence.py"
      - "scripts/test_real_refresh_evidence.py"
      - ".github/workflows/cram_real_refresh_evidence.yml"
  workflow_dispatch:
permissions:
  contents: read

jobs:
  forced-real-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: dtolnay/rust-toolchain@1.89.0

      - name: Compile exact benchmark
        run: cargo check -p nine65 --bin nine65_bench --features serde

      - name: Exact renewal-observer regressions
        run: cargo test -p nine65 --bin nine65_bench --features serde

      - name: Exact refresh-preflight regression
        run: cargo test -p nine65 --release --test refresh_preflight_regression -- --nocapture

      - name: Real-refresh evidence negative controls
        run: python3 scripts/test_real_refresh_evidence.py

      - name: Force and prove real automatic refresh
        # Deterministic correctness evidence uses debug because release
        # builds intentionally reject this benchmark's seeded test RNG.
        run: |
          set -euo pipefail
          cargo run --locked -p nine65 --bin nine65_bench --features serde -- \
            --config secure_128_deep --max-depth 1 --auto-bootstrap \
            --trigger-pct 100 --statistical-test \
            --output /tmp/nine65-forced-refresh.json 2>&1 | tee /tmp/nine65-forced-refresh.log
          python3 scripts/check_real_refresh_evidence.py /tmp/nine65-forced-refresh.json \
            --config secure_128_deep --requested-operations 1

      - name: Preserve real-refresh evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forced-public-refresh
          path: /tmp/nine65-forced-refresh.*
          if-no-files-found: warn
