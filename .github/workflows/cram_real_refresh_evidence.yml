name: Public Refresh Research and Boundary Evidence

# Branch gating repaired: the pull_request trigger named
# `hardening/beyond-100-app-platform`, a branch that no longer exists (the
# repo has only `main` and `claude/*`), so this workflow's PR trigger never
# fired on real PR activity -- only `workflow_dispatch` reached it. Re-pointed
# at the real trunk, matching the fix already applied to
# app_platform_gates.yml and the other cram_*.yml workflows on 2026-08-12.

on:
  push:
    branches:
      - main
    paths:
      - "crates/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "rust-toolchain.toml"
      - ".github/workflows/cram_real_refresh_evidence.yml"
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "crates/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "rust-toolchain.toml"
      - ".github/workflows/cram_real_refresh_evidence.yml"
  workflow_dispatch:
permissions:
  contents: read

jobs:
  public-refresh-research:
    name: "Research only · public refresh/return/repeat + production refusal"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: dtolnay/rust-toolchain@1.89.0

      - name: Verify exact-test runner and public integer bounds
        env:
          PYTHONPATH: scripts
        run: >-
          python3 -m unittest -v
          test_run_public_refresh_research_gates
          test_public_refresh_architecture
          test_public_refresh_lift_refinement
          test_compact_phase_clock_budget
          test_outer_ring_return_budget
          test_source_encapsulation_budget
          test_cram_hou_jiang_screen

      - name: Require production public refresh to remain typed fail-closed
        run: >-
          python3 scripts/run_public_refresh_research_gates.py
          --suite production-boundary
          --log-dir work/public-refresh-gates/production-boundary

      # Explicitly run the small-ring complete refresh/return/repeat probes.
      # Their public evaluators receive no decryption oracle; a client checks
      # every output coefficient through the dependent cycles. The other
      # selected scale-boundary diagnostics retain labeled oracle controls.
      # These tests do not grant native production security admission.
      - name: Check public API histories, refresh cycles and plaintext boundaries
        run: >-
          python3 scripts/run_public_refresh_research_gates.py
          --suite research
          --log-dir work/public-refresh-gates/research

      # The full-Q square checks all 16384 coefficients against an independent
      # schoolbook oracle; the nonlinear section still runs at its Q211 level.
      # Neither result is a native refresh/return/repeat acceptance claim.
      - name: Check native wide arithmetic and Frobenius section only
        run: >-
          python3 scripts/run_public_refresh_research_gates.py
          --suite native-arithmetic
          --log-dir work/public-refresh-gates/native-arithmetic

      # Native dense work is publicly converted to an independent sparse
      # source with immutable full-polynomial history and checked bounds.
      # This stage alone does not admit complete native or secure refresh.
      - name: Check native public source preparation and history boundaries
        run: >-
          python3 scripts/run_public_refresh_research_gates.py
          --suite source-preparation
          --log-dir work/public-refresh-gates/source-preparation

      - name: Check public return arithmetic and malformed proof boundaries
        run: >-
          python3 scripts/run_public_refresh_research_gates.py
          --suite return-boundary
          --log-dir work/public-refresh-gates/return-boundary

      - name: Preserve focused evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-refresh-research-${{ github.sha }}
          path: work/public-refresh-gates/
          if-no-files-found: warn

  # Legacy/default entry points must refuse; research success is checked above.
  refresh-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: dtolnay/rust-toolchain@1.89.0

      - name: Compile exact benchmark
        run: cargo check -p nine65 --bin nine65_bench --features serde

      - name: Exact renewal-observer regressions
        run: cargo test -p nine65 --bin nine65_bench --features serde

      - name: Exact refresh-preflight regression
        run: cargo test -p nine65 --release --test refresh_preflight_regression -- --nocapture

      - name: Real-refresh evidence negative controls
        run: python3 scripts/test_real_refresh_evidence.py

      # Issue #95: legacy Clockwork Phase 1 still drops its secret-dependent carry.
      # Exercise the exact boundary and typed refusal without claiming a
      # successful public refresh.
      - name: Public Phase-1 gate remains fail-closed
        run: cargo test -p nine65 --lib --release public_phase1_is_typed_fail_closed

      - name: Automatic refresh is exact until typed refusal
        run: cargo test -p nine65 --lib --release auto_refresh_boundary_is_exact_then_typed_refusal -- --nocapture
