name: CRAM Real Refresh Evidence

# Branch gating repaired: the pull_request trigger named
# `hardening/beyond-100-app-platform`, a branch that no longer exists (the
# repo has only `main` and `claude/*`), so this workflow's PR trigger never
# fired on real PR activity -- only `workflow_dispatch` reached it. Re-pointed
# at the real trunk, matching the fix already applied to
# app_platform_gates.yml and the other cram_*.yml workflows on 2026-08-12.

on:
  push:
    branches:
      - main
    paths:
      - "crates/nine65/src/bin/nine65_bench.rs"
      - "crates/nine65/src/noise/budget.rs"
      - "crates/nine65/src/ops/auto_bootstrap.rs"
      - "crates/nine65/src/ops/bootstrap.rs"
      - "crates/nine65/src/ops/rns_fhe.rs"
      - "crates/nine65/tests/refresh_preflight_regression.rs"
      - ".github/workflows/cram_real_refresh_evidence.yml"
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "crates/nine65/src/bin/nine65_bench.rs"
      - "crates/nine65/src/noise/budget.rs"
      - "crates/nine65/src/ops/auto_bootstrap.rs"
      - "crates/nine65/src/ops/bootstrap.rs"
      - "crates/nine65/src/ops/rns_fhe.rs"
      - "crates/nine65/tests/refresh_preflight_regression.rs"
      - ".github/workflows/cram_real_refresh_evidence.yml"
  workflow_dispatch:
permissions:
  contents: read

jobs:
  forced-real-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: dtolnay/rust-toolchain@1.89.0

      - name: Compile exact benchmark
        run: cargo check -p nine65 --bin nine65_bench --features serde

      - name: Exact refresh-preflight regression
        run: cargo test -p nine65 --release --test refresh_preflight_regression -- --nocapture

      - name: Force and prove real automatic refresh
        # This is a deterministic correctness/evidence run, not a performance
        # benchmark. The RNG guard intentionally allows seeded RNG in debug
        # builds and forbids it in release builds.
        run: |
          set -euo pipefail
          cargo run --locked -p nine65 --bin nine65_bench --features serde -- \
            --config secure_128_deep --max-depth 1 --auto-bootstrap \
            --trigger-pct 100 --statistical-test \
            --output /tmp/nine65-forced-refresh.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/nine65-forced-refresh.json').read_text())

          def assert_integral(node, path='$'):
              if isinstance(node, bool):
                  return
              if isinstance(node, float):
                  raise AssertionError(f'non-integer number in report at {path}: {node!r}')
              if isinstance(node, dict):
                  for key, value in node.items():
                      assert_integral(value, f'{path}.{key}')
              elif isinstance(node, list):
                  for index, value in enumerate(node):
                      assert_integral(value, f'{path}[{index}]')

          assert_integral(report)
          assert report['metadata']['bootstrap_mode'] == 'real'
          chain = report['operation_chain']
          assert chain['requested_operations'] == 1
          assert chain['completed_requested'] is True
          assert chain['achieved_chain_correct'] is True
          assert chain['real_refreshes'] > 0
          statistical = report['statistical_test']
          assert statistical['enabled'] is True
          assert statistical['trials'] == 100
          assert statistical['successes'] == statistical['trials']
          assert statistical['real_refreshes'] > 0
          PY
