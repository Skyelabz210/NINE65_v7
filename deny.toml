[advisories]
# cargo-deny 0.18 removed the old severity switches. Keep the advisory gate
# fail-closed for unmaintained dependencies instead of silently ignoring them.
unmaintained = "all"
yanked = "warn"
ignore = [{ id = "RUSTSEC-2025-0141", reason = "Legacy validated key/ciphertext formats are deployed. Codec replacement needs a versioned migration and compatibility tests. Permit only existing direct users until that migration is done.", allow = ["fhe-service@0.1.0", "nine65@0.1.0"] }]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "Unicode-3.0",
    "BSL-1.0",
    "ISC",
    "Unicode-DFS-2016",
]
confidence-threshold = 0.8

[[licenses.clarify]]
# unhal is the internal hardware-abstraction crate (MIT, matches its Cargo.toml).
# The license-files array is empty because the license is declared in Cargo.toml only,
# not via a separate LICENSE file in the crate directory. This is intentional.
name = "unhal"
expression = "MIT"
license-files = []

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
