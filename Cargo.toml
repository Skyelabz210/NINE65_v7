[workspace]
members = ["crates/*"]
exclude = ["fuzz", "crates/nine65-python", "crates/nine65-wasm", "crates/nine65-ffi"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Acidlabz210 <acid@hackfate.us>"]
# The repository LICENSE is proprietary: "All rights reserved", and
# "Permission is not granted to use, copy, modify, publish, distribute,
# sublicense, and/or sell". Package metadata is what crawlers, registries and
# downstream consumers read, so every crate declares a marker that matches
# that grant. The idstring says AllRightsReserved deliberately: an earlier
# marker read "-Permissive", which contradicted the LICENSE it was standing
# in for. New crates inherit via `license.workspace = true` or repeat the
# literal string.
license = "LicenseRef-Proprietary-AllRightsReserved"

[workspace.dependencies]
# SIMD acceleration
wide = "0.7"              # Portable SIMD (stable Rust)

# Parallelism
rayon = "1.10"            # Opt-in data parallelism (MANA is canonical)

# Crypto (from NINE65)
zeroize = { version = "1.7", features = ["derive"] }
getrandom = "0.2"
subtle = "2.5"
sha2 = "0.10"
thiserror = "1.0"
rand_core = "0.6"
rand_chacha = "0.3"

# Dev
criterion = "0.5"
proptest = "1.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.bench]
opt-level = 3
lto = "fat"

